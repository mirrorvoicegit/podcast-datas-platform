/* 讓滑鼠選取與瀏覽器的文字範圍不受到其他工具干擾 */

#newTextNoteBtn{display:none!important}

/* EditCue Editorial — chrome is monochrome, semantics alone use fills. */
:root{--bg:#F4F4F2;--white:#FFF;--ink:#18191A;--muted:#797B7B;--edge:#DCDCD8;--accent:#18191A;--soft:#F4F4F2;--red:#B22C32;--redbg:#FFF;--violet:#5A468C;--blue:#18191A;--radius:4px;color-scheme:light}
html,body{background:var(--bg)!important;color:var(--ink)!important;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif!important;letter-spacing:.005em}
.shell{background:var(--bg)}
/* hairlines and folded corner: these are decorative, never interactive */
.header{height:72px;min-height:72px;background:#fff;color:#191919;border-bottom:1px solid #B8B9B6;padding:0 28px;gap:22px;position:relative}
.header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#202020 0 56px,#C8CAC7 56px 100%);pointer-events:none}
.brand{font-size:21px;font-weight:800;letter-spacing:-.7px;gap:12px;min-width:auto;color:#141414;white-space:nowrap}
.brand .micro{color:#858585;font-size:10px;letter-spacing:1px;font-weight:600;margin-left:3px;text-transform:uppercase}
.symbol{font-size:0!important;width:36px;height:36px;position:relative;border-radius:1px;background:#171818;clip-path:polygon(0 0,72% 0,100% 28%,100% 100%,0 100%);box-shadow:none}
.symbol::before{content:"";position:absolute;left:10px;top:11px;width:16px;height:13px;border-top:2px solid #fff;border-bottom:2px solid #fff;box-shadow:0 -5px 0 -3px #fff;pointer-events:none}
.symbol::after{content:"";position:absolute;right:0;top:0;width:10px;height:10px;background:linear-gradient(135deg,#F4F4F2 0 49%,#989A99 50%);pointer-events:none}
.titlefield{color:#262626;font-size:13px;font-weight:550;max-width:420px;letter-spacing:0;border-bottom:1px solid transparent;border-radius:0}
.titlefield:hover,.titlefield:focus{border-bottom-color:#313131}
.headright{gap:10px}
.headbtn{color:#242424;background:#fff;border:1px solid #BDBFBD;border-radius:3px;min-height:37px;height:37px;padding:0 15px;font-size:12px;font-weight:650;box-shadow:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.headbtn:hover{background:#F0F0ED;border-color:#777}
.headbtn.action,.headbtn.action:hover{background:#171818!important;border-color:#171818!important;color:#fff!important}
.headbtn.action:hover{background:#3C3D3C!important;transform:translateY(-1px)}
.headbtn.reset-btn{border:0;background:transparent;color:#707070}
.headbtn.reset-btn:hover{background:#F0F0ED;color:#181818}
.body{grid-template-columns:minmax(500px,1fr) minmax(285px,325px);gap:17px;padding:18px 22px 15px;background:var(--bg)}
.card{background:#fff;border:1px solid #CECFCC;border-radius:3px;box-shadow:0 2px 1px #00000005;}
.workspace{position:relative;isolation:isolate;overflow:hidden;border-color:#BFC0BC}
.workspace::after{content:"";position:absolute;z-index:8;bottom:0;right:0;width:24px;height:24px;background:linear-gradient(135deg, transparent 0 49%,#A6A7A4 50%,#E7E8E6 52%,#F8F8F8 100%);pointer-events:none;filter:drop-shadow(-2px -2px 1px #00000010)}
.toolbar{min-height:64px;padding:12px 17px;border-bottom:1px solid #D7D8D5;background:#fff}
.toolbar::before{content:"TRANSCRIPT  /  EDIT";display:block;position:absolute;right:42px;bottom:11px;font:600 8px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:2.1px;color:#B9BAB7;pointer-events:none;opacity:0}
.section-name{font-size:13px;font-weight:800;letter-spacing:.03em;color:#202020}
.count{font-size:11px;color:#8E8E8D;font-variant-numeric:tabular-nums}
.search{width:238px;height:36px;background:#F9F9F8;border:1px solid #E4E4E0;border-radius:3px;color:#222;font-size:12px;padding:0 13px;transition:border-color .15s,background .15s}
.search:focus{border-color:#555;background:#fff}
.search::placeholder{color:#9B9B9B}
.iconbtn,.undo-btn{color:#656767;border:1px solid transparent;border-radius:2px}
.iconbtn:hover,.undo-btn:hover:not(:disabled){background:#EEEDEA;color:#171818}
.transcript{background:#fff;padding:10px 15px 40px;scrollbar-color:#C8C9C6 transparent}
.txrow{grid-template-columns:90px minmax(0,1fr) 20px;gap:14px;border-radius:2px;padding:13px 15px;margin:3px 0;border:1px solid transparent;transition:background .13s ease,box-shadow .13s ease,border-color .13s ease}
.txrow:hover:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){background:#F6F6F4}
.txrow.selected:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){background:#F3F3F1;border-color:#888;outline:0;box-shadow:inset 3px 0 #282828}
.txrow.selected{outline:1px solid #777!important;outline-offset:-1px}
.time{color:#777A78;font:600 11.5px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:-.3px}
.line-number{color:#B1B2B0;font-size:10px;margin-top:3px}
.speech{font-size:16px;line-height:1.85;color:#1F2020;font-weight:450;letter-spacing:.015em}
.rowchev{color:#777}
/* exactly three fill meanings: cut, highlight, graphic range; everything else text only */
.txrow.mark-cut,.txrow.mark-cut:hover,.txrow.hasmarks.mark-cut{background:#E7E8E7!important;box-shadow:inset 4px 0 #7D7F7D!important}
.txrow.mark-cut .speech{text-decoration:line-through;text-decoration-color:#656866;text-decoration-thickness:1.4px;color:#656866}
.txrow.range-yellow:not(.mark-cut),.txrow.range-green:not(.mark-cut),.txrow.range-yellow:hover:not(.mark-cut),.txrow.range-green:hover:not(.mark-cut){background:#FFF26B!important;box-shadow:inset 4px 0 #C0A15C!important}
.txrow.range-highlight:not(.mark-cut):not(.range-yellow):not(.range-green),.txrow.range-highlight:hover:not(.mark-cut):not(.range-yellow):not(.range-green){background:#EAE7F5!important;box-shadow:inset 4px 0 #786999!important}
.txrow.range-special:not(.mark-cut):not(.range-highlight):not(.range-yellow):not(.range-green){background:#fff!important;box-shadow:none!important}
.txrow.graphic-separator:not(.mark-cut){border-top:2px dashed #937D51!important;border-radius:0 0 2px 2px!important;margin-top:0;padding-top:14px}
.txrow.hasmarks:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){box-shadow:none!important}
.txrow:has(.tag.highlight):not(.mark-cut):not(.range-highlight){box-shadow:none!important}
.txrow.range-preview{background:#FFF26B!important;box-shadow:inset 4px 0 #C0A15C!important}
.range-handle{border:1px solid #D9CDAA;border-radius:2px;background:#FFF8E4;color:#67552B;opacity:.75;font-size:17px;cursor:ns-resize}
.range-handle:hover{background:#FFF1CD;opacity:1}
/* no filled pills except actual duration bands */
.rowtags{gap:7px;align-items:center;margin-top:8px}
.tag,.tag:hover{background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0 5px 0 0;font-weight:770;font-size:11px;line-height:1.45;letter-spacing:.02em}
.tag::before{content:"▸";margin-right:5px;font-size:9px;vertical-align:1px}
.tag.cut{color:#525655!important}
.tag.highlight{color:#5D4D8E!important}
.tag.card,.tag.visual,.tag.textcard{color:#806329!important}
.tag.captions,.tag.other,.tag.move,.tag.short{color:#B12B32!important}
.cue-inline-note{background:transparent!important;border-left:2px solid #B12B32;color:#AB2B30;padding:3px 0 4px 10px;font-size:12px;line-height:1.7}
.cue-inline-image{border:1px solid #D8D8D4;border-radius:0}
.red-note{background:#fff!important;border:1px solid #DEDEDA!important;border-left:3px solid #BD2D32!important;border-radius:2px!important}
.red-note textarea{color:#B6232B;font-size:15px}
.add-red-note{display:none!important}
/* panels and cards: fine print, measured alignments, crop marks */
.asidecard{padding:15px 14px 12px}
#assetPanel{position:relative;border-color:#BFC0BC;isolation:isolate}
#assetPanel::before{content:"";position:absolute;right:0;top:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 0 46%,#B5B6B3 47% 51%,#F2F2F0 52%);pointer-events:none;z-index:2}
#assetPanel::after{content:"";position:absolute;right:25px;bottom:16px;width:9px;height:9px;border-left:1px solid #BDBEBB;border-top:1px solid #BDBEBB;pointer-events:none;opacity:.8}
.asidehead{padding-bottom:11px;margin-bottom:12px;border-bottom:1px solid #E5E5E1;align-items:center}
.asidehead h2{font-size:12px;font-weight:750;letter-spacing:.01em;color:#2A2A2A}
.countbadge{background:transparent;border:1px solid #DDDDDA;border-radius:1px;color:#838383;padding:3px 7px;font-size:10px}
.asset-add{width:30px;height:30px;background:#fff;border:1px solid #C9CBC8;border-radius:1px;color:#333;font-size:21px;transition:background .16s,border-color .16s}
.asset-add:hover{background:#F1F1EF;border-color:#3A3A3A}
.asset-add[data-tip]:hover:after{background:#191919;border-radius:2px;color:white}
.assetlist{gap:11px;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 3px 4px 0}
.assetitem{padding:7px;border:1px solid #D8D9D7;border-radius:2px;background:#fff;position:relative;transition:border-color .16s ease,box-shadow .16s ease}
.assetitem::before{content:"";position:absolute;top:-1px;left:-1px;width:10px;height:10px;border-top:1px solid #A3A4A1;border-left:1px solid #A3A4A1;pointer-events:none}
.assetitem:hover{border-color:#292929;box-shadow:0 3px 12px #0000000d}
.assetitem.asset-used{background:white!important;border-color:#303230;box-shadow:inset 0 0 0 1px #303230}

function redNoteMarkup(note){return `<div class="red-note" data-red-id="${escapeHtml(note.id)}" draggable="false">

function refreshAll(){
 cachedNoteOrder=null;
 if(!rows.length){selected.clear();anchor=-1;lastSelectionRect=null;window._showInspector=false;editId=null;}
 else selected=new Set([...selected].filter(i=>Number.isInteger(i)&&i>=0&&i<rows.length));

function setKind(k){kindId=k;window._showInspector=['move','card','captions','visual','other','textcard'].includes(k);$('toolBar').querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.kind===k));renderInspector()}
function renderInspector(){const host=$('inspectorBody');$('inspector').classList.toggle('hasselection',!!editId||!!window._showInspector);const s=selectionIndices(),editing=annotations.find(a=>a.id===editId);$('pickedCount').textContent=s.length+' 段';$('inspectorTitle').textContent=editing?'修改標示':'標示需求';if(!s.length&&!editing){$('inspector').classList.remove('hasselection');window._showInspector=false;host.className='emptyedit';host.innerHTML='先選取台詞，再新增標示';return}host.className='';if(window._showInspector||editing){$('inspector').classList.add('hasselection');positionInspector()} const first=rows[s[0]],last=rows[s.at(-1)];const interval=first?.start?asClock(first.start)+' – '+asClock(last.end):s.length+' 段';const chosen=editing?.kind||kindId;
host.innerHTML=`<div class="clipmeta"><span style="font-size:20px">${chosen==='cut'?'✕':chosen==='card'?'▣':chosen==='move'?'↔':'✦'}</span><div><strong>${escapeHtml(findKind(chosen).label)}</strong><br><span>${escapeHtml(interval)}</span></div></div>

${chosen==='card'||chosen==='visual'?`<div class="field"><label class="fieldlabel" for="noteAsset">圖卡</label><select id="noteAsset"><option value="">選擇圖卡（可選填）</option>${assets.map(a=>`<option value="${escapeHtml(a.id)}" ${(editing?.assetId||assetChoice)===a.id?'selected':''}>${escapeHtml(a.code+' · '+a.name)}</option>`).join('')}</select></div>`:''}

$('pasteReference')?.addEventListener('click',pasteReferenceFromClipboard);$('browseReference')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('referenceImageInput').click()}});$('referenceDrop')?.addEventListener('click',e=>{if(!e.target.closest('button'))e.currentTarget.focus()});$('clearReference')?.addEventListener('click',()=>{referenceChoice='__CLEAR__';renderInspector()});$('applyCue').onclick=applyCue;$('cancelCue').onclick=()=>{editId=null;window._showInspector=false;assetChoice='';referenceChoice='';setSelection([]);renderInspector()};requestAnimationFrame(positionInspector);if(editing)$('deleteCue').onclick=()=>{pushUndo();annotations=annotations.filter(a=>a.id!==editing.id);editId=null;setSelection([]);refreshAll();markDirty();toast('標示已移除')};}
function applyCue(){const s=selectionIndices(),previous=annotations.find(a=>a.id===editId);if(!s.length){toast('請先選取逐字稿段落');return}const type=previous?.kind||kindId,detail=$('noteDetail').value.trim(),assetId=$('noteAsset')?.value||'',title=$('noteTitle').value.trim();if(type==='move'&&!detail){toast('Specify where this section should move');$('noteDetail').focus();return}if(type==='card'&&!detail&&!assetId&&!title){toast('Choose a graphic or enter an instruction');return}

function insertGraphic(id,inds=selectionIndices()){

async function importPptx(file){if(file.size>120*1024*1024)throw Error('簡報超過120MB，請先分成較小檔案');

async function importFile(f){if(!f)return;let ext=f.name.split('.').at(-1).toLowerCase();try{if(ext==='json'){const d=JSON.parse(await f.text());if(!Array.isArray(d.rows)||!Array.isArray(d.annotations))throw Error('Not an EditCue project');loadContent({title:d.title,source:d.sourceName||f.name,loadedRows:d.rows,loadedNotes:d.annotations,loadedRedNotes:d.redNotes||[],loadedAssets:d.assets||[],rawSource:d.sourceRawText||'',docxSource:d.originalDocxBase64||'',inputType:d.sourceType||''});toast('專案已恢復');return}
let rawSource='',docxSource='';if(ext==='docx'){const buffer=await f.arrayBuffer();await parseDocx(buffer);docxSource=b64(new Uint8Array(buffer))}else if(['srt','vtt','txt'].includes(ext)){rawSource=await f.text();parsePlain(rawSource)}else throw Error('Unsupported file type');const loadedRows=rows;loadContent({loadedAssets:assets,title:f.name.replace(/\.[^.]+$/,''),source:f.name,loadedRows,rawSource,docxSource,inputType:ext});toast(loadedRows.length+' 段已匯入')}catch(e){console.error(e);toast('Import failed: '+e.message)}}
// 不依賴 FileReader：部分本機瀏覽器或擴充功能環境會覆寫它，導致 readAsDataURL 不存在。
// 使用原生 Blob.arrayBuffer 產生 Data URL，所有圖片匯入入口共用。
async function fileAsUrl(file){
 if(!file||typeof file.arrayBuffer!=='function')throw Error('無法讀取圖片內容，請重新選取檔案');
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(!bytes.byteLength)throw Error('這張圖片是空檔案');
 return 'data:'+(file.type||'application/octet-stream')+';base64,'+b64(bytes);
}
// 接收圖片時以檔名副檔名為主要判準，避免 Windows / 拖曳圖片缺少 MIME 而被略過。
// GIF、BMP、AVIF 等瀏覽器可解碼的格式，轉成 PNG 以便嵌入 Word 與 ZIP。
const IMAGE_MIMES={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',bmp:'image/bmp',avif:'image/avif'};
function imageExtension(file){return (file?.name||'').split('.').pop().toLowerCase()}
function imageFileSupported(file){return !!IMAGE_MIMES[imageExtension(file)]||/^image\/(png|jpeg|webp|gif|bmp|avif)$/i.test(file?.type||'')}
async function readImage(file){
 const ext=imageExtension(file),mime=IMAGE_MIMES[ext]||file.type;
 if(!imageFileSupported(file))throw Error('不支援的圖片類型：'+file.name+'，請改用 JPG、PNG、WebP、GIF、BMP 或 AVIF');
 if(file.size>65*1024*1024)throw Error(file.name+' 超過 65 MB，請先縮小檔案');
 const typed=mime&&file.type!==mime?new Blob([file],{type:mime}):file;
 let src=await fileAsUrl(typed);
 const dims=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve({width:im.naturalWidth,height:im.naturalHeight,element:im});im.onerror=()=>reject(Error('無法解碼 '+file.name+'，請另存成 JPG 或 PNG 後再試'));im.src=src});
 if(!dims.width||!dims.height)throw Error('無法讀取圖片尺寸：'+file.name);
 if(!['png','jpg','jpeg'].includes(ext)||!/^data:image\/(png|jpeg|webp);base64,/.test(src)){
  const canvas=document.createElement('canvas');canvas.width=dims.width;canvas.height=dims.height;
  canvas.getContext('2d').drawImage(dims.element,0,0);src=canvas.toDataURL('image/png');

}
async function addAssets(fileList){

  try{
   const {src,width,height}=await readImage(f);
   const asset={id:'g'+Date.now()+Math.random().toString(36).slice(2),code:nextAssetCode(),name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,dataUrl:src,width,height};
   assets.push(asset);newItems.push(asset);
  }catch(e){console.warn('圖片匯入失敗',f.name,e);errors.push(e.message||String(e))}
 }
 if(newItems.length){
  renderAssets();renderInspector();markDirty();focusNewAsset(newItems.at(-1).id);
  $('pptStatus').classList.remove('hidden');
  $('pptStatus').textContent='已新增 '+newItems.length+' 張圖片'+(errors.length?'，'+errors.length+' 張失敗':'');
  toast('已新增 '+newItems.length+' 張圖片');
 }

  const message=errors.slice(0,3).join('；')+(errors.length>3?'；另有 '+(errors.length-3)+' 項錯誤':'');
  $('pptStatus').classList.remove('hidden');
  $('pptStatus').textContent=(newItems.length?'部分圖片匯入失敗：':'圖片匯入失敗：')+message;

 }

}

async function ingestFiles(fileList){const files=Array.from(fileList||[]);if(!files.length)return;

function parseTimeRange(s){const m=s.match(/((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})/);return m?{start:m[1],end:m[2]}:null}
function makeRow(seq,time,text,extra='',imgs=[],paragraphIndices=[]){return {uid:'r'+rows.length+'_'+Math.random().toString(36).slice(2,6),seq:safeText(seq),start:time?.start||'',end:time?.end||'',text:safeText(text),sourceNotes:extra?[safeText(extra)]:[],images:imgs||[],paragraphIndices}}
function parseParagraphs(paras){rows=[];let preface=[],seq=0;
 for(let i=0;i<paras.length;i++){
  let p=paras[i],s=(p.text||'').trim(), imgs=p.images||[];
  if(!s&&!imgs.length)continue;
  // 格式甲：字幕編號、時間碼、台詞分開三個段落。
  if(/^\d{1,6}$/.test(s)&&paras[i+1]&&parseTimeRange(paras[i+1].text||'')){
   let t=parseTimeRange(paras[i+1].text),p2=paras[i+2];let speech=(p2?.text||'').trim();
   if(speech&&!parseTimeRange(speech)&&!/^\d+$/.test(speech)){rows.push(makeRow(s,t,speech,'',imgs.concat(p2.images||[]),[i,i+1,i+2]));i+=2}
   else {rows.push(makeRow(s,t,'','',imgs,[i,i+1]));i+=1}continue;
  }
  // 格式乙：同一段落包含字幕編號、時間碼和台詞。
  const full=s.match(/^(\d{1,6})\s+((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})(?:\s+(.*))?$/);
  if(full){rows.push(makeRow(full[1],{start:full[2],end:full[3]},full[4]||'', '', imgs,[i]));continue}
  // 無字幕編號的 SRT、VTT 時間碼。
  const range=parseTimeRange(s);
  if(range&&/^\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}/.test(s)){
    let suffix=s.replace(/^.*?-->\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}\s*/,'');
    let next=paras[i+1];let speech=suffix||((next?.text||'').trim());
    rows.push(makeRow(++seq,range,speech,'',imgs.concat(!suffix&&next?.images||[]),(!suffix&&next?.text)?[i,i+1]:[i]));
    if(!suffix&&next?.text)i++;continue;
  }
  if(!rows.length){preface.push(s);continue}
  // 匯入舊稿時保留原稿的圖卡補充資料與圖片，不將舊色碼當成新標示。
  if(s)rows[rows.length-1].sourceNotes.push(s);
  if(imgs.length)rows[rows.length-1].images.push(...imgs);
 }
 if(!rows.length){ // 沒有字幕時間碼的普通文字，以自然段落為最小單位。
  rows=paras.filter(p=>(p.text||'').trim()||(p.images||[]).length).map((p,i)=>makeRow(i+1,null,(p.text||'').trim(),'',p.images||[],[i]));
  preface=[];
 }
 return preface;
}
function parsePlain(text){let lines=safeText(text).replace(/\r\n?/g,'\n').split('\n').map(s=>({text:s,images:[]}));return parseParagraphs(lines)}

 html+='</html>';download(cleanFileName(all.title)+'_後製需求單.html',new Blob([html],{type:'text/html;charset=utf-8'}));toast('已匯出可閱讀、列印的網頁檔（保留原稿圖片）。')}

// 嚴格保留原稿：字幕原始行數、文字、時間碼與順序不變，只增加顏色和獨立指示行。

let cachedNoteOrder=null;

function sourceLineMap(lines){const out=new Map();let i=0,idx=0;

    let from=i;let j=i+2;while(j<lines.length&&lines[j].trim()!=='')j++;

}
function replaceExcludedIds(blockedIds){

function quickCue(type){

 if(type==='cut')replaceExcludedIds(new Set(fresh));
 // 只有整段的第一句保留標籤，其餘字幕靠底色和刪除線辨識。
 annotations.push({id:newCueId(),kind:type,detail:'',title:'',reference:'',assetId:'',rowIds:fresh});

 async function get(name){let x=map.get(name);if(!x)return null;let q=x.off;if(readU32(dv,q)!==0x04034b50)throw Error('Word 檔案內容損壞');let o=q+30+readU16(dv,q+26)+readU16(dv,q+28);let bytes=raw.slice(o,o+x.size);if(x.method===0)return bytes;if(x.method!==8)throw Error('不支援此 Word 壓縮方式');if(!('DecompressionStream'in window))throw Error('此瀏覽器不支援 Word 解壓縮，請使用新版 Chrome 或 Edge');let out=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();return new Uint8Array(out)}return {get,entries:[...map.keys()]};}
function b64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x5000){out+=String.fromCharCode(...bytes.subarray(i,i+0x5000))}return btoa(out)}
async function parseDocx(buffer){const zip=await unzipDocx(buffer),docB=await zip.get('word/document.xml');if(!docB)throw Error('找不到 Word 正文，請確認是 .docx 格式');let xml=new DOMParser().parseFromString(new TextDecoder().decode(docB),'application/xml');if(xml.getElementsByTagName('parsererror').length)throw Error('Word XML 格式錯誤');let relMap=new Map();let rb=await zip.get('word/_rels/document.xml.rels');if(rb){let rels=new DOMParser().parseFromString(new TextDecoder().decode(rb),'application/xml');for(const r of rels.getElementsByTagNameNS(REL,'Relationship')){let id=r.getAttribute('Id'),target=r.getAttribute('Target')||'';relMap.set(id,target.replace(/^\//,'').replace(/^\.\.\//,''))}}
 const paras=[],elements=xml.getElementsByTagNameNS(W,'p');for(let p of elements){let text='';let tree=document.createTreeWalker(p,NodeFilter.SHOW_ELEMENT);while(tree.nextNode()){let x=tree.currentNode;if(x.namespaceURI!==W)continue;if(x.localName==='t')text+=x.textContent;else if(x.localName==='tab')text+='\t';else if(x.localName==='br')text+='\n'}let pics=[];for(const blip of p.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main','blip')){let rid=blip.getAttributeNS(R,'embed'),target=relMap.get(rid);if(!target)continue;let name=target.startsWith('word/')?target:'word/'+target;let bytes=await zip.get(name);if(bytes&&bytes.length<7_000_000){let mime=/\.png$/i.test(name)?'image/png':/\.gif$/i.test(name)?'image/gif':/\.webp$/i.test(name)?'image/webp':'image/jpeg';pics.push('data:'+mime+';base64,'+b64(bytes))}}paras.push({text,images:pics})}return parseParagraphs(paras)}

function crcTable(){let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):(c>>>1);t[n]=c>>>0}return t}const CRC_TABLE=crcTable();
function crc32(u){let c=0xffffffff;for(const x of u)c=CRC_TABLE[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function put16(a,i,n){a[i]=n&255;a[i+1]=(n>>>8)&255}function put32(a,i,n){put16(a,i,n&65535);put16(a,i+2,(n>>>16)&65535)}
// 原生 ZIP 寫入：產生可以在 Word 開啟的 .docx，無須外部套件。
function zipStored(files){let chunks=[],central=[],offset=0;for(const [name,string] of Object.entries(files)){let nameB=enc.encode(name),data=string instanceof Uint8Array?string:enc.encode(string),crc=crc32(data),local=new Uint8Array(30+nameB.length),dv=new DataView(local.buffer);put32(local,0,0x04034b50);put16(local,4,20);put16(local,6,0x0800);put16(local,8,0);put32(local,14,crc);put32(local,18,data.length);put32(local,22,data.length);put16(local,26,nameB.length);local.set(nameB,30);chunks.push(local,data);let c=new Uint8Array(46+nameB.length);put32(c,0,0x02014b50);put16(c,4,20);put16(c,6,20);put16(c,8,0x0800);put32(c,16,crc);put32(c,20,data.length);put32(c,24,data.length);put16(c,28,nameB.length);put32(c,42,offset);c.set(nameB,46);central.push(c);offset+=local.length+data.length}
 const centralOffset=offset,centralSize=central.reduce((n,c)=>n+c.length,0);let e=new Uint8Array(22);put32(e,0,0x06054b50);put16(e,8,central.length);put16(e,10,central.length);put32(e,12,centralSize);put32(e,16,centralOffset);return new Blob([...chunks,...central,e],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
function assetBytes(asset){let raw=atob(asset.dataUrl.split(',')[1]);let arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr}
function imageXml(rid,imageID,label,asset){const maxW=3350000,maxH=2300000,ratio=(asset.width||750)/(asset.height||450),cx=ratio>maxW/maxH?maxW:Math.round(maxH*ratio),cy=ratio>maxW/maxH?Math.round(maxW/ratio):maxH;return `<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${imageID}" name="${escXml(label)}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="0" name="${escXml(label)}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`}
function pXml(text,opt={}){let b=opt.bold?' <w:b/> ':'';let color=opt.color?`<w:color w:val="${opt.color}"/>`:'';let hilite=opt.highlight?`<w:shd w:fill="${opt.highlight}"/>`:'';let size=opt.heading?'32':'28';let after=opt.heading?'180':'95';return `<w:p><w:pPr><w:spacing w:before="0" w:after="${after}" w:line="330" w:lineRule="auto"/></w:pPr><w:r><w:rPr><w:rFonts w:eastAsia="Microsoft JhengHei" w:ascii="Aptos"/><w:sz w:val="${size}"/><w:szCs w:val="${size}"/>${b}${color}${hilite}</w:rPr><w:t xml:space="preserve">${escXml(text)}</w:t></w:r></w:p>`}


// 手機使用者直接點原生 input；匯入事件委派可處理動態產生的空白畫面。
document.addEventListener('change',async e=>{
  const input=e.target.closest('input[data-native-upload]');
  if(!input)return;
  const files=Array.from(input.files||[]);
  input.value='';
  if(!files.length)return;
  try{await ingestFiles(files)}
  catch(err){console.error(err);toast('檔案匯入失敗：'+(err?.message||String(err)))}
},true);
</script>
