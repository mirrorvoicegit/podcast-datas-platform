function findKind(id){return KINDS.find(x=>x.id===id)||KINDS.at(-1)}
function assetById(id){return assets.find(a=>a.id===id)}
function imageFormat(s){return (s||'').match(/^data:(image\/(?:png|jpeg|webp));base64,/)?.[1]||'image/png'}
function nextAssetCode(){let n=1;while(assets.some(x=>x.code==='G'+String(n).padStart(2,'0')))n++;return 'G'+String(n).padStart(2,'0')}
function prettyText(a){const i=rows.find(r=>r.uid===a.rowIds[0]),j=rows.find(r=>r.uid===a.rowIds.at(-1));return i?.start?asClock(i.start)+'–'+asClock(j?.end):'Lines '+(i?.seq||'?')+'–'+(j?.seq||'?')}
function serializable(){return{app:'EditCue',version:'1.0',title:$('docTitle').value||'未命名節目',sourceName,rows,assets,annotations,preset:PRESET}}
function markDirty(){draftRevision++;$('saveStatus').textContent='正在儲存到本機…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await saveLocal(serializable());$('saveStatus').textContent='已儲存於本機 · 未上傳檔案'}catch(e){console.warn(e);$('saveStatus').textContent='自動儲存未啟用 · 請下載專案檔'}},750)}
function selectionIndices(){return [...selected].sort((a,b)=>a-b)}
function setSelection(set){selected=new Set(set);paintSelection();renderInspector()}
function paintSelection(){const s=selectionIndices();$('pickedCount').textContent=s.length+' 段';$('selectionInfo').textContent=s.length?(s.length+' 段已選取 · '+(rows[s[0]]?.start?asClock(rows[s[0]].start)+' → '+asClock(rows[s.at(-1)].end):'段 '+(s[0]+1)+'–'+(s.at(-1)+1))):'點選台詞 · Shift 可連選';$('clearBtn').style.visibility=s.length?'visible':'hidden';$('selectAllBtn').classList.toggle('hidden',!rows.length);for(const el of $('transcript').querySelectorAll('.txrow'))el.classList.toggle('selected',selected.has(+el.dataset.i));}
function toggleRow(index,e={}){if(e.shiftKey&&anchor>=0){const a=Math.min(anchor,index),b=Math.max(anchor,index),n=e.metaKey||e.ctrlKey?new Set(selected):new Set();for(let x=a;x<=b;x++)n.add(x);setSelection(n)}else if(e.metaKey||e.ctrlKey){let n=new Set(selected);n.has(index)?n.delete(index):n.add(index);setSelection(n);anchor=index}else{if(selected.size===1&&selected.has(index)){setSelection([])}else setSelection([index]);anchor=index}}
function annotationsForRow(id){return annotations.filter(a=>a.rowIds.includes(id))}
function rowMarkup(r,i){const anns=annotationsForRow(r.uid),cut=anns.some(a=>a.kind==='cut');return `<div class="txrow${anns.length?' hasmarks':''}${cut?' mark-cut':''}${selected.has(i)?' selected':''}" data-i="${i}" draggable="false"><div class="time">${r.start?escapeHtml(asClock(r.start)):'—'}<div class="line-number">${escapeHtml(r.seq||i+1)}</div></div><div><div class="speech">${escapeHtml(r.text||'（無台詞）')}</div>${anns.length?`<div class="rowtags">${anns.map(a=>`<button class="tag ${a.kind}" data-cue="${escapeHtml(a.id)}" title="點選修改">${escapeHtml(findKind(a.kind).label)}${assetById(a.assetId)?' · '+escapeHtml(assetById(a.assetId).code):''}</button>`).join('')}</div>`:''}${r.images?.length?'<div>'+r.images.slice(0,4).map(src=>`<img class="sourceimg" src="${src}" alt="原始參考圖片">`).join('')+'</div>':''}</div><div class="rowchev">›</div></div>`}
function renderRows(){const host=$('transcript');if(!rows.length){host.innerHTML=`<div class="blank" id="emptyState"><div class="blankicon"><svg class="ic" style="width:29px;height:29px"><use href="#i-file"/></svg></div><h2>匯入逐字稿，開始標示。</h2><p>拖入 Word 或字幕檔<br>也可直接貼上 Google 文件內容</p><button class="blankbtn" id="browseStart">選擇檔案</button><span class="blanksmall">DOCX · SRT · VTT · TXT · JSON &nbsp; / &nbsp; ⌘V</span></div>`;return}
const q=$('searchInput').value.trim().toLowerCase();let html='',found=0;for(let i=0;i<rows.length;i++){const r=rows[i];if(q&&!`${r.start} ${r.end} ${r.seq} ${r.text}`.toLowerCase().includes(q))continue;html+=rowMarkup(r,i);found++}host.innerHTML=found?html:'<div class="emptyedit" style="padding:60px">No matching lines.</div>';paintSelection();}
function renderCounters(){$('rowCount').textContent=rows.length+' 段';$('summary').textContent=annotations.length+' 則標示 · '+assets.length+' 張圖卡';$('assetCount').textContent=assets.length;$('cueCount').textContent=annotations.length}
function renderCueList(){const host=$('notesList');if(!annotations.length){host.innerHTML='<div class="notes-empty">尚無標示</div>';return}host.innerHTML=annotations.slice().sort((a,b)=>rows.findIndex(r=>r.uid===a.rowIds[0])-rows.findIndex(r=>r.uid===b.rowIds[0])).map(a=>`<button class="notepill" data-cue="${escapeHtml(a.id)}"><b>${escapeHtml(findKind(a.kind).label)}</b> <span>${escapeHtml(assetById(a.assetId)?.code||a.title||a.detail||prettyText(a))}</span></button>`).join('')}
function renderAssets(){const host=$('assetList');host.innerHTML=assets.map(a=>`<div class="assetitem" data-asset="${escapeHtml(a.id)}"><div class="thumb" draggable="true" data-asset-drag="${escapeHtml(a.id)}" title="拖到逐字稿指定的台詞"><img src="${a.dataUrl}" alt="${escapeHtml(a.name)}"></div><div class="assetfoot"><input class="assetcode" data-code="${escapeHtml(a.id)}" value="${escapeHtml(a.code)}" title="修改圖卡編號"><button data-insert="${escapeHtml(a.id)}" title="插入選取台詞">+ 插入</button></div><input class="assetname" data-name="${escapeHtml(a.id)}" value="${escapeHtml(a.name)}" title="修改圖卡名稱"><div class="assetfoot" style="justify-content:flex-end"><button class="trash" data-remove="${escapeHtml(a.id)}" title="移除圖卡">移除</button></div></div>`).join('')||'<div class="noassets" style="grid-column:1/-1">上傳的圖卡會顯示在這裡</div>';renderCounters()}
function refreshAll(){renderRows();renderCounters();renderAssets();renderCueList();renderInspector()}
function setKind(k){kindId=k;$('toolBar').querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.kind===k));renderInspector()}
function renderInspector(){const host=$('inspectorBody');const s=selectionIndices(),editing=annotations.find(a=>a.id===editId);$('pickedCount').textContent=s.length+' 段';$('inspectorTitle').textContent=editing?'修改標示':'標示需求';if(!s.length&&!editing){host.className='emptyedit';host.innerHTML='先選取台詞，再新增標示';return}host.className='';const first=rows[s[0]],last=rows[s.at(-1)];const interval=first?.start?asClock(first.start)+' – '+asClock(last.end):s.length+' 段';const chosen=editing?.kind||kindId;
host.innerHTML=`<div class="clipmeta"><span style="font-size:20px">${chosen==='cut'?'✕':chosen==='card'?'▣':chosen==='move'?'↔':'✦'}</span><div><strong>${escapeHtml(findKind(chosen).label)}</strong><br><span>${escapeHtml(interval)}</span></div></div>
<div class="field"><label class="fieldlabel" for="noteDetail">處理說明 ${chosen==='cut'?'(optional)':''}</label><textarea id="noteDetail" placeholder="${chosen==='move'?'移到哪段後面？':chosen==='cut'?'刪除原因（可留空）':chosen==='card'?'顯示方式、圖卡文字（選填）':'需要怎麼處理？'}">${escapeHtml(editing?.detail||'')}</textarea></div>
${chosen==='card'||chosen==='visual'?`<div class="field"><label class="fieldlabel" for="noteAsset">圖卡</label><select id="noteAsset"><option value="">選擇圖卡（可選填）</option>${assets.map(a=>`<option value="${escapeHtml(a.id)}" ${(editing?.assetId||assetChoice)===a.id?'selected':''}>${escapeHtml(a.code+' · '+a.name)}</option>`).join('')}</select></div>`:''}
<div class="field"><label class="fieldlabel" for="noteTitle">備註名稱（選填）</label><input id="noteTitle" placeholder="${chosen==='move'?'例如：移到第三段前':chosen==='card'?'圖卡標題':'備註名稱'}" value="${escapeHtml(editing?.title||'')}"></div>
<div class="applyrow"><button class="apply" id="applyCue">${editing?'儲存修改':'新增標示'}</button><button class="subtle" id="cancelCue">取消</button></div>${editing?'<button class="delete" id="deleteCue">刪除此標示</button>':''}`;
$('applyCue').onclick=applyCue;$('cancelCue').onclick=()=>{editId=null;assetChoice='';setSelection([]);renderInspector()};if(editing)$('deleteCue').onclick=()=>{annotations=annotations.filter(a=>a.id!==editing.id);editId=null;setSelection([]);refreshAll();markDirty();toast('標示已移除')};}
function applyCue(){const s=selectionIndices(),previous=annotations.find(a=>a.id===editId);if(!s.length){toast('請先選取逐字稿段落');return}const type=previous?.kind||kindId,detail=$('noteDetail').value.trim(),assetId=$('noteAsset')?.value||'',title=$('noteTitle').value.trim();if(type==='move'&&!detail){toast('Specify where this section should move');$('noteDetail').focus();return}if(type==='card'&&!detail&&!assetId&&!title){toast('Choose a graphic or enter an instruction');return}
const fields={kind:type,detail,title,reference:'',assetId,rowIds:s.map(i=>rows[i].uid)};if(previous)Object.assign(previous,fields);else annotations.push({id:'cue'+Date.now()+Math.random().toString(36).slice(2),...fields});editId=null;assetChoice='';setSelection([]);refreshAll();markDirty();toast(previous?'標示已更新':'標示已新增')}
function insertGraphic(id,inds=selectionIndices()){if(!inds.length){assetChoice=id;setKind('card');toast('先選取逐字稿，再插入圖卡');return}const a=assetById(id);if(!a)return;annotations.push({id:'cue'+Date.now()+Math.random().toString(36).slice(2),kind:'card',title:a.name,detail:'',reference:'',assetId:id,rowIds:inds.map(i=>rows[i].uid)});editId=null;assetChoice='';setSelection([]);refreshAll();markDirty();toast(a.code+' inserted')}
function editCue(id){const a=annotations.find(x=>x.id===id);if(!a)return;editId=id;kindId=a.kind;const inds=a.rowIds.map(id=>rows.findIndex(r=>r.uid===id)).filter(i=>i>=0);setSelection(inds);$('toolBar').querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.kind===a.kind));renderInspector();let first=$('transcript').querySelector('.txrow.selected');first?.scrollIntoView({block:'center',behavior:'smooth'})}
function loadContent({title,source,loadedRows,loadedNotes=[],loadedAssets=[]}){rows=loadedRows;annotations=loadedNotes;assets=loadedAssets;sourceName=source;$('docTitle').value=title||'未命名節目';selected.clear();anchor=-1;editId=null;assetChoice='';$('searchInput').value='';refreshAll();markDirty()}
function importText(text,name='Pasted transcript'){const s=safeText(text);if(!s.trim())return; if(rows.length&&!confirm('Replace current transcript with pasted text? Save your draft first if needed.'))return;parsePlain(s);const loadedRows=rows;loadContent({title:name,source:name,loadedRows});toast(loadedRows.length+' 段已匯入')}
function saveProject(){if(!rows.length&&!assets.length){toast('尚無可儲存的資料');return}download(cleanFileName($('docTitle').value)+'.editcue.json',new Blob([JSON.stringify(serializable())],{type:'application/json;charset=utf-8'}));toast('工作檔已儲存')}
async function importFile(f){if(!f)return;let ext=f.name.split('.').at(-1).toLowerCase();try{if(ext==='json'){const d=JSON.parse(await f.text());if(!Array.isArray(d.rows)||!Array.isArray(d.annotations))throw Error('Not an EditCue project');loadContent({title:d.title,source:d.sourceName||f.name,loadedRows:d.rows,loadedNotes:d.annotations,loadedAssets:d.assets||[]});toast('專案已恢復');return}
if(ext==='docx'){await parseDocx(await f.arrayBuffer())}else if(['srt','vtt','txt'].includes(ext)){parsePlain(await f.text())}else throw Error('Unsupported file type');const loadedRows=rows;loadContent({title:f.name.replace(/\.[^.]+$/,''),source:f.name,loadedRows});toast(loadedRows.length+' 段已匯入')}catch(e){console.error(e);toast('Import failed: '+e.message)}}
async function fileAsUrl(f){return new Promise((resolve,reject)=>{let rd=new FileReader;rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(Error('Failed to read image'));rd.readAsDataURL(f)})}
async function addAssets(files){let added=0;for(const f of files){if(!/^image\/(png|jpeg|webp)$/.test(f.type))continue;if(f.size>18*1024*1024){toast('Image is over 18 MB: '+f.name);continue}let src=await fileAsUrl(f);if(f.type==='image/webp'){src=await new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);resolve(c.toDataURL('image/png'))};im.onerror=reject;im.src=src})}
const dims=await new Promise(resolve=>{const im=new Image;im.onload=()=>resolve({width:im.naturalWidth,height:im.naturalHeight});im.onerror=()=>resolve({width:960,height:600});im.src=src});assets.push({id:'g'+Date.now()+Math.random().toString(36).slice(2),code:nextAssetCode(),name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,dataUrl:src,...dims});added++}if(added){renderAssets();renderInspector();markDirty();toast(added+' 張圖卡已加入')}}
async function ingestFiles(fileList){const files=Array.from(fileList||[]);if(!files.length)return;const doc=files.find(f=>!/\.(png|jpe?g|webp)$/i.test(f.name)&&!/^image\//.test(f.type));if(doc&&rows.length&&!confirm('Replace current transcript? Save your draft first if needed.'))return;processingFiles=true;try{if(doc)await importFile(doc);await addAssets(files.filter(f=>/^image\//.test(f.type)||/\.(png|jpe?g|webp)$/i.test(f.name)))}finally{processingFiles=false}}
function isEditingTarget(e){return e?.target?.closest?.('input,textarea,select,[contenteditable="true"]')}
function changeImageCode(id,value,el){const a=assetById(id);if(!a)return;const s=value.trim();if(!s||assets.some(x=>x!==a&&x.code.toLowerCase()===s.toLowerCase())){el.value=a.code;toast('Graphic code must be unique');return}a.code=s;renderCueList();renderRows();renderInspector();markDirty()}
function removeAsset(id){const a=assetById(id);if(!a)return;const refs=annotations.some(x=>x.assetId===id);if(refs&&!confirm('This graphic is used in a cue. Remove it anyway?'))return;assets=assets.filter(a=>a.id!==id);for(const x of annotations)if(x.assetId===id)x.assetId='';refreshAll();markDirty()}
// IndexedDB 在瀏覽器本機儲存草稿，不傳送至任何伺服器。
function openDB(){return new Promise((res,rej)=>{if(!('indexedDB'in window))return rej(Error('no IndexedDB'));const r=indexedDB.open('editcue-local-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('drafts')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveLocal(data){const db=await openDB();return new Promise((resolve,reject)=>{const t=db.transaction('drafts','readwrite'),q=t.objectStore('drafts').put(data,'current');q.onsuccess=()=>resolve();q.onerror=()=>reject(q.error);t.oncomplete=()=>db.close()})}
async function restoreLocal(){try{const db=await openDB(),data=await new Promise((res,rej)=>{const t=db.transaction('drafts','readonly'),r=t.objectStore('drafts').get('current');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);t.oncomplete=()=>db.close()});if(data?.rows?.length||data?.assets?.length){loadContent({title:data.title,source:data.sourceName||'Last draft',loadedRows:data.rows||[],loadedNotes:data.annotations||[],loadedAssets:data.assets||[]});$('saveStatus').textContent='已恢復本機草稿 · 未上傳檔案';toast('已恢復上次的草稿')}}catch(e){console.warn('Draft restore',e)}}

function parseTimeRange(s){const m=s.match(/((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})/);return m?{start:m[1],end:m[2]}:null}
function makeRow(seq,time,text,extra='',imgs=[]){return {uid:'r'+rows.length+'_'+Math.random().toString(36).slice(2,6),seq:safeText(seq),start:time?.start||'',end:time?.end||'',text:safeText(text),sourceNotes:extra?[safeText(extra)]:[],images:imgs||[]}}
function parseParagraphs(paras){rows=[];let preface=[],seq=0;
 for(let i=0;i<paras.length;i++){
  let p=paras[i],s=(p.text||'').trim(), imgs=p.images||[];
  if(!s&&!imgs.length)continue;
  // 格式甲：字幕編號、時間碼、台詞分開三個段落。
  if(/^\d{1,6}$/.test(s)&&paras[i+1]&&parseTimeRange(paras[i+1].text||'')){
   let t=parseTimeRange(paras[i+1].text),p2=paras[i+2];let speech=(p2?.text||'').trim();
   if(speech&&!parseTimeRange(speech)&&!/^\d+$/.test(speech)){rows.push(makeRow(s,t,speech,'',imgs.concat(p2.images||[])));i+=2}
   else {rows.push(makeRow(s,t,'','',imgs));i+=1}continue;
  }
  // 格式乙：同一段落包含字幕編號、時間碼和台詞。
  const full=s.match(/^(\d{1,6})\s+((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})(?:\s+(.*))?$/);
  if(full){rows.push(makeRow(full[1],{start:full[2],end:full[3]},full[4]||'', '', imgs));continue}
  // 無字幕編號的 SRT、VTT 時間碼。
  const range=parseTimeRange(s);
  if(range&&/^\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}/.test(s)){
    let suffix=s.replace(/^.*?-->\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}\s*/,'');
    let next=paras[i+1];let speech=suffix||((next?.text||'').trim());
    rows.push(makeRow(++seq,range,speech,'',imgs.concat(!suffix&&next?.images||[])));
    if(!suffix&&next?.text)i++;continue;
  }
  if(!rows.length){preface.push(s);continue}
  // 匯入舊稿時保留原稿的圖卡補充資料與圖片，不將舊色碼當成新標示。
  if(s)rows[rows.length-1].sourceNotes.push(s);
  if(imgs.length)rows[rows.length-1].images.push(...imgs);
 }
 if(!rows.length){ // 沒有字幕時間碼的普通文字，以自然段落為最小單位。
  rows=paras.filter(p=>(p.text||'').trim()||(p.images||[]).length).map((p,i)=>makeRow(i+1,null,(p.text||'').trim(),'',p.images||[]));
  preface=[];
 }
 return preface;
}
function parsePlain(text){let lines=safeText(text).replace(/\r\n?/g,'\n').split('\n').map(s=>({text:s,images:[]}));return parseParagraphs(lines)}

// 下方以通用 OOXML 格式匯出剪輯需求單，圖片直接嵌入 Word。
function exportHtml(){if(!rows.length){toast('尚無逐字稿');return}const all=serializable();let css=`body{font:15px/1.7 "Microsoft JhengHei",sans-serif;color:#182837;margin:30px auto;max-width:900px}h1{font-size:25px}h2{margin-top:30px;border-bottom:2px solid #d4e1e5;padding-bottom:6px}h3{font-size:15px;margin:0 0 4px}.rule{background:#eaf5f4;padding:14px;border-radius:8px}.note{padding:12px;border:1px solid #cfd9e2;border-left:5px solid #176b72;margin:9px 0;break-inside:avoid}.small{font-size:12px;color:#687987}.row{padding:8px 10px;border-bottom:1px solid #e1e5e8;break-inside:avoid}.row.cut{background:#fff0ef}.row.marked{border-left:3px solid #9fc4cb}.rowtext{white-space:pre-wrap}.source{font-size:12px;color:#728398}.tag{color:#276477;font-weight:bold}img{max-width:220px;max-height:180px;object-fit:contain;margin:5px}button{display:none}@media print{body{margin:15mm;max-width:none}}`;
 let html=`<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>${escXml(all.title)}</title><style>${css}
</style><h1>${escXml(all.title)}｜後製需求單</h1><div class="rule"><b>共通規範：</b>${escXml(all.preset)}<div class="small">特殊標示共 ${annotations.length} 項；未標示的段落不代表未處理。</div></div><h2>特殊需求清單</h2>`;
 if(!annotations.length)html+='<p>沒有額外特殊需求，依共通規範剪輯。</p>';
 for(const a of annotations){html+=`<div class="note"><h3>${escXml(findKind(a.kind).label)}｜${escXml(a.title||'未命名')}</h3><div class="small">${escXml(prettyText(a))}</div><div>${escXml(a.detail||'')}</div><div class="source">${escXml(a.reference||'')}</div>${assetById(a.assetId)?'<div class="image-callout">'+escXml(assetById(a.assetId).code+'｜'+assetById(a.assetId).name)+'</div><img src="'+assetById(a.assetId).dataUrl+'" alt="圖卡素材">':''}</div>`}
 html+='<h2>逐字稿與標示</h2>';
